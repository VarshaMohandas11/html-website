      content="Contact information for The Little Taco Shop" />
    <title>Contact Us - LTS</title>
    <link rel="stylesheet" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Contact Us</h1>
      <nav>
        <ul>
          <li>
            <a href="/">Home</a>
          </li>
          <li>
            <a href="/#about"
              >About <abbr title="The Little Taco Shop Hours">TLS</abbr></a
            >
          </li>
        
          <li>
            <a href="/#menu">Our Menu</a>
          </li>

          <li>
            <a href="hours.html">Store Hours</a>
          </li>
        </ul>
      </nav>

      <figure>
        <img
          src="img/taocs2.webp"
          alt="Little Taco Shop Tacos"
          title="Tacos Ready To Eat!"
          width="400"
          height="267
                " />
        <figcaption>Little Taco Shop Tacos</figcaption>
      </figure>
    </header>
    <hr />
    <main>
      <section>
        <h2>Our Contact From</h2>
        <form action="" method="get">
          <fieldset>
            <legend>Send Us A Message</legend>
            <p>
              <label for="name">Name:</label>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="your name"
                required />
            </p>
            <p>
              <label for="email">Email:</label>
              <input
                type="email"
                name="email"
                id="name"
                placeholder="your email"
                required />
            </p>

            <p>
              <label for="message">Your Message:</label>
              <textarea
                name="message"
                id="message"
                cols="30"
                rows="10"
                placeholder="your message here"></textarea>
            </p>
          </fieldset>
          <button type="submit">Send</button>
          <button type="reset">Rest</button>
        </form>
      </section>
      <section>
        <h2>Our Location</h2>
        <address>
            555 Taco Temptation Lane, Suite T <br>
            Kanasas City, MD 788789789
            <br><br>
            phone: <a href="tel:+9876543212">9876654322</a>
        </address>
      </section>
    </main>
    <br>
    <br>
<a href="#">Back To Top</a>

    </footer>
